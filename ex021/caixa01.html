<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: lightgray;
            height: 300px;
            width: 300px;

            /*border-width: 10px;
            border-style: solid;
            border-color: rgb(0, 152, 152);
            em baixo esta simplificado*/

            border: 10px solid darkslategray;

            /*padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
             em baixo esta simplificado se todos os lados forem iguais. se forem diferente somente colocar assim
             padding: 10px 15px 15px 16px*/
            
             padding: 10px;
            
            /*
            use sempre o " margin: auto " para centralizar alguma caixa
            */

            margin: 20px auto 40px auto;
            
            /*outline-width: 5px;
            outline-style: dashed;
            outline-color: black;
            simplificado em baixo*/

            outline: 5px dashed black;
        }

        a {
            
            border: 2px solid red;
            padding: 2px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafo também são exemplos de box-level, mas os <a href="#">Links são exemplos de caixas inline-level</a>. Vamos ver tudo isso funcionar. </p>
</body>
</html>
